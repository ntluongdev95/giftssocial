name = "gao-social-dev"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "gao-social-dev"
database_id = "65f8c45c-b3d4-4f02-91b1-e6f828cc2e26"

[[kv_namespaces]]
binding = "SOCIAL_KV"
id = "49968b6c630147a284b3b2e93eec6422"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "gao-social-dev"

[env.dev]
name = "gao-social-dev"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "gao-social-dev"
database_id = "65f8c45c-b3d4-4f02-91b1-e6f828cc2e26"

[[env.dev.kv_namespaces]]
binding = "SOCIAL_KV"
id = "49968b6c630147a284b3b2e93eec6422"

[[env.dev.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "gao-social-dev"

[env.dev.vars]
NEXT_PUBLIC_APP_URL = "https://app-dev.gao.social"
NEXT_PUBLIC_GOOGLE_CLIENT_ID = "499445244143-pa0de62qhs87qbaorpsfno4sgcv0vq4i.apps.googleusercontent.com"

[vars]
NEXT_PUBLIC_APP_URL = "https://app-dev.gao.social"
NEXT_PUBLIC_GOOGLE_CLIENT_ID = "804965667901-cda2uc7kdatpsf35gm5ek54fktcr9vva.apps.googleusercontent.com"

# ─── Streak reminders cron (every 15 min) ──────────────────────────────────
# Calls /api/v1/cron/streak-reminders. Secrets (CRON_SECRET, VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY, VAPID_SUBJECT, NEXT_PUBLIC_VAPID_PUBLIC_KEY) are set via
# `wrangler secret put <NAME>` — they're not committed here.
[triggers]
crons = ["*/15 * * * *"]

[env.dev.triggers]
crons = ["*/15 * * * *"]

[env.production.triggers]
crons = ["*/15 * * * *"]

# ─── Production ──────────────────────────────────────────────────────────────
[env.production]
name = "gao-social"
routes = [{ pattern = "app.gao.social", custom_domain = true }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "gao-social-db"
database_id = "35bee37a-4660-4db0-a04a-19ae7b481461"

[[env.production.kv_namespaces]]
binding = "SOCIAL_KV"
id = "4224c2b4d5424b88b256fd6ead4c6530"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "gao-social-prod"

[env.production.vars]
NEXT_PUBLIC_APP_URL = "https://app.gao.social"
NEXT_PUBLIC_GOOGLE_CLIENT_ID = "804965667901-cda2uc7kdatpsf35gm5ek54fktcr9vva.apps.googleusercontent.com"
