<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8f0"/>
      <stop offset="0.5" stop-color="#cce6f4"/>
      <stop offset="1" stop-color="#e8f2f6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa0bc"/>
      <stop offset="0.5" stop-color="#4ec0d2"/>
      <stop offset="1" stop-color="#7ed0d8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6c4"/>
      <stop offset="1" stop-color="#e8d8a8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffeb5b"/>
      <stop offset="0.6" stop-color="#ffc842"/>
      <stop offset="1" stop-color="#ffc842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="palmLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8a4a"/>
      <stop offset="1" stop-color="#1f5a2a"/>
    </linearGradient>
    <radialGradient id="hibiscus" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbb4b4"/>
      <stop offset="1" stop-color="#e34869"/>
    </radialGradient>
    <radialGradient id="hibiscusOrange" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffd0a0"/>
      <stop offset="1" stop-color="#f08858"/>
    </radialGradient>
    <linearGradient id="flamingo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbb4c4"/>
      <stop offset="1" stop-color="#e87898"/>
    </linearGradient>
    <linearGradient id="pineapple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdd34c"/>
      <stop offset="1" stop-color="#d49830"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a98a8"/>
      <stop offset="1" stop-color="#3a6878"/>
    </linearGradient>
    <linearGradient id="shellPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0d4"/>
      <stop offset="1" stop-color="#e8a890"/>
    </linearGradient>

    <!-- Reusable palm frond -->
    <g id="palmFrond">
      <path d="M 0 0 Q 60 -20, 120 -30" stroke="#2a6a3a" stroke-width="2" fill="none"/>
      <!-- leaflets along the stem -->
      <ellipse cx="20"  cy="-8"  rx="14" ry="4" fill="url(#palmLeaf)" transform="rotate(-25 20 -8)"/>
      <ellipse cx="40"  cy="-14" rx="18" ry="5" fill="url(#palmLeaf)" transform="rotate(-30 40 -14)"/>
      <ellipse cx="60"  cy="-20" rx="22" ry="6" fill="url(#palmLeaf)" transform="rotate(-35 60 -20)"/>
      <ellipse cx="80"  cy="-24" rx="22" ry="6" fill="url(#palmLeaf)" transform="rotate(-40 80 -24)"/>
      <ellipse cx="100" cy="-28" rx="20" ry="5" fill="url(#palmLeaf)" transform="rotate(-45 100 -28)"/>
      <ellipse cx="20"  cy="8"   rx="14" ry="4" fill="url(#palmLeaf)" transform="rotate(25 20 8)" opacity="0.9"/>
      <ellipse cx="40"  cy="16"  rx="18" ry="5" fill="url(#palmLeaf)" transform="rotate(30 40 16)" opacity="0.9"/>
      <ellipse cx="60"  cy="22"  rx="22" ry="6" fill="url(#palmLeaf)" transform="rotate(35 60 22)" opacity="0.9"/>
      <ellipse cx="80"  cy="26"  rx="22" ry="6" fill="url(#palmLeaf)" transform="rotate(40 80 26)" opacity="0.9"/>
    </g>

    <!-- Reusable hibiscus flower -->
    <g id="hibiscusFlower">
      <!-- 5 petals around center -->
      <ellipse cx="0"   cy="-32" rx="28" ry="34" fill="url(#hibiscus)"/>
      <ellipse cx="30"  cy="-10" rx="28" ry="34" fill="url(#hibiscus)" transform="rotate(72 30 -10)"/>
      <ellipse cx="20"  cy="28"  rx="28" ry="34" fill="url(#hibiscus)" transform="rotate(144 20 28)"/>
      <ellipse cx="-20" cy="28"  rx="28" ry="34" fill="url(#hibiscus)" transform="rotate(216 -20 28)"/>
      <ellipse cx="-30" cy="-10" rx="28" ry="34" fill="url(#hibiscus)" transform="rotate(288 -30 -10)"/>
      <!-- inner darker petals -->
      <circle cx="0" cy="0" r="14" fill="#a83048" opacity="0.7"/>
      <!-- centre pistil -->
      <circle cx="0" cy="0" r="6" fill="#fde6a4"/>
      <line x1="0" y1="-2" x2="0" y2="-18" stroke="#fde6a4" stroke-width="3"/>
      <circle cx="0" cy="-18" r="3" fill="#ffd24a"/>
    </g>
  </defs>

  <!-- ── Sky ─────────────────────────────────────────────────────── -->
  <rect width="540" height="540" fill="url(#sky)"/>

  <!-- sun rays (subtle, behind logo area) -->
  <g transform="translate(270,160)" opacity="0.7">
    <g stroke="#ffd24a" stroke-width="2.5">
      <line x1="0" y1="-90" x2="0" y2="-50"/>
      <line x1="40" y1="-80" x2="22" y2="-44"/>
      <line x1="-40" y1="-80" x2="-22" y2="-44"/>
      <line x1="75" y1="-50" x2="42" y2="-28"/>
      <line x1="-75" y1="-50" x2="-42" y2="-28"/>
      <line x1="90" y1="0" x2="50" y2="0"/>
      <line x1="-90" y1="0" x2="-50" y2="0"/>
    </g>
    <!-- sun half -->
    <path d="M -55 10 A 55 55 0 0 1 55 10 Z" fill="#ffc842"/>
  </g>

  <!-- city skyline silhouette far-left -->
  <g fill="#5a98b8" opacity="0.5">
    <rect x="0"  y="340" width="20" height="100"/>
    <rect x="22" y="320" width="18" height="120"/>
    <rect x="42" y="350" width="16" height="90"/>
    <rect x="60" y="305" width="22" height="135"/>
    <rect x="84" y="345" width="14" height="95"/>
    <rect x="100" y="335" width="16" height="105"/>
  </g>
  <!-- mountain silhouette -->
  <path d="M 0 460 L 80 380 L 140 420 L 180 400 L 220 440 L 0 540 Z" fill="#4a8090" opacity="0.55"/>

  <!-- ── Sea band ──────────────────────────────────────────────── -->
  <path d="M 0 440 C 100 430, 200 460, 270 440 C 340 420, 440 450, 540 430 L 540 580 L 0 580 Z" fill="url(#sea)"/>
  <!-- sea highlights -->
  <path d="M 0 470 C 120 460, 260 490, 540 470" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 0 510 C 100 500, 280 525, 540 505" stroke="#fff" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M 0 550 C 120 545, 280 562, 540 548" stroke="#fff" stroke-width="0.6" fill="none" opacity="0.25"/>

  <!-- ── Sand band ─────────────────────────────────────────────── -->
  <path d="M 0 560 C 100 555, 200 580, 270 565 C 340 552, 440 578, 540 558 L 540 960 L 0 960 Z" fill="url(#sand)"/>

  <!-- ── Top-left palm fronds + hibiscus ──────────────────────── -->
  <g transform="translate(-10,80)">
    <use href="#palmFrond" transform="rotate(-30)"/>
    <use href="#palmFrond" transform="rotate(20) translate(-10, 30)"/>
  </g>
  <use href="#hibiscusFlower" transform="translate(70,80) scale(1.2)"/>
  <use href="#hibiscusFlower" transform="translate(40,200) scale(0.9)" opacity="0.95"/>
  <!-- secondary orange-coral hibiscus -->
  <g transform="translate(40,210) scale(0.7)">
    <ellipse cx="0"   cy="-32" rx="28" ry="34" fill="url(#hibiscusOrange)"/>
    <ellipse cx="30"  cy="-10" rx="28" ry="34" fill="url(#hibiscusOrange)" transform="rotate(72 30 -10)"/>
    <ellipse cx="20"  cy="28"  rx="28" ry="34" fill="url(#hibiscusOrange)" transform="rotate(144 20 28)"/>
    <ellipse cx="-20" cy="28"  rx="28" ry="34" fill="url(#hibiscusOrange)" transform="rotate(216 -20 28)"/>
    <ellipse cx="-30" cy="-10" rx="28" ry="34" fill="url(#hibiscusOrange)" transform="rotate(288 -30 -10)"/>
    <circle cx="0" cy="0" r="14" fill="#c85228" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#fde6a4"/>
  </g>

  <!-- ── Top-right palm fronds ────────────────────────────────── -->
  <g transform="translate(550,80)">
    <use href="#palmFrond" transform="rotate(190)"/>
    <use href="#palmFrond" transform="rotate(160) translate(-10, -10)"/>
  </g>

  <!-- ── Right-side flamingo silhouette ───────────────────────── -->
  <g transform="translate(420,360)">
    <!-- body -->
    <ellipse cx="40" cy="60" rx="55" ry="40" fill="url(#flamingo)"/>
    <!-- neck (S curve) -->
    <path d="M 40 30 C 60 -20, 30 -60, 50 -100 C 60 -120, 80 -120, 90 -110" stroke="url(#flamingo)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="92" cy="-108" rx="22" ry="18" fill="url(#flamingo)"/>
    <!-- beak -->
    <path d="M 110 -106 L 134 -98 L 130 -90 L 108 -100 Z" fill="#1a1a1a"/>
    <path d="M 110 -106 L 132 -100 L 128 -94 Z" fill="#f0a890"/>
    <!-- heart-shaped sunglasses -->
    <g transform="translate(80,-118)">
      <path d="M 0 0 C -6 -8, -16 -6, -16 4 C -16 12, -6 14, 0 22 C 6 14, 16 12, 16 4 C 16 -6, 6 -8, 0 0 Z" fill="#1a1a1a"/>
      <path d="M 0 4 C -3 0, -8 1, -8 6 C -8 10, -3 11, 0 14 C 3 11, 8 10, 8 6 C 8 1, 3 0, 0 4 Z" fill="#3a3a3a" opacity="0.7"/>
    </g>
    <!-- legs -->
    <line x1="20" y1="100" x2="14" y2="160" stroke="#e87898" stroke-width="4"/>
    <line x1="50" y1="100" x2="44" y2="160" stroke="#e87898" stroke-width="4"/>
    <!-- plumeria flower on head -->
    <g transform="translate(76,-126)" opacity="0.9">
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#fff" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#fff" transform="rotate(72)"/>
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#fff" transform="rotate(144)"/>
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#fff" transform="rotate(216)"/>
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#fff" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3" fill="#ffd24a"/>
    </g>
  </g>

  <!-- ── Left-side pineapple with heart sunglasses ────────────── -->
  <g transform="translate(40,540)">
    <!-- crown (green leaves) -->
    <g fill="url(#palmLeaf)">
      <path d="M 30 -40 L 24 0 L 36 0 Z"/>
      <path d="M 42 -50 L 38 0 L 50 0 Z" transform="rotate(-10 42 -50)"/>
      <path d="M 18 -50 L 14 0 L 26 0 Z" transform="rotate(10 18 -50)"/>
      <path d="M 30 -60 L 28 0 L 32 0 Z"/>
    </g>
    <!-- body -->
    <ellipse cx="30" cy="50" rx="32" ry="50" fill="url(#pineapple)"/>
    <!-- criss-cross texture -->
    <g stroke="#a06820" stroke-width="0.7" fill="none" opacity="0.65">
      <line x1="5"  y1="20" x2="55" y2="60"/>
      <line x1="5"  y1="40" x2="55" y2="80"/>
      <line x1="5"  y1="60" x2="55" y2="100"/>
      <line x1="55" y1="20" x2="5"  y2="60"/>
      <line x1="55" y1="40" x2="5"  y2="80"/>
      <line x1="55" y1="60" x2="5"  y2="100"/>
    </g>
    <!-- heart sunglasses -->
    <g transform="translate(20,30)">
      <path d="M 0 0 C -4 -5, -10 -4, -10 2 C -10 7, -4 9, 0 14 C 4 9, 10 7, 10 2 C 10 -4, 4 -5, 0 0 Z" fill="#e34869"/>
    </g>
    <g transform="translate(40,30)">
      <path d="M 0 0 C -4 -5, -10 -4, -10 2 C -10 7, -4 9, 0 14 C 4 9, 10 7, 10 2 C 10 -4, 4 -5, 0 0 Z" fill="#e34869"/>
    </g>
    <line x1="10" y1="32" x2="30" y2="32" stroke="#e34869" stroke-width="2"/>
  </g>

  <!-- ── Bottom-left shell + starfish ───────────────────────── -->
  <g transform="translate(40,890)">
    <!-- starfish -->
    <g fill="#f48a4a">
      <path d="M 0 -25 L 8 -8 L 24 -6 L 12 6 L 16 22 L 0 14 L -16 22 L -12 6 L -24 -6 L -8 -8 Z"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#d4621a" opacity="0.7"/>
  </g>
  <g transform="translate(110,910)">
    <!-- shell -->
    <path d="M 0 0 L -24 14 L -16 28 L 0 22 L 16 28 L 24 14 Z" fill="url(#shellPink)"/>
    <path d="M 0 0 L 0 22" stroke="#c08070" stroke-width="0.8" fill="none"/>
    <path d="M -10 8 L -8 22" stroke="#c08070" stroke-width="0.6" fill="none"/>
    <path d="M 10 8 L 8 22" stroke="#c08070" stroke-width="0.6" fill="none"/>
  </g>

  <!-- ── Bottom-right shell + starfish ──────────────────────── -->
  <g transform="translate(490,900)">
    <ellipse cx="0" cy="0" rx="26" ry="18" fill="url(#shellPink)"/>
    <path d="M -22 4 Q 0 -14, 22 4" stroke="#c08070" stroke-width="0.8" fill="none"/>
    <path d="M -16 6 Q 0 -6, 16 6" stroke="#c08070" stroke-width="0.6" fill="none"/>
  </g>
  <g transform="translate(430,920)">
    <g fill="#e87060">
      <path d="M 0 -22 L 7 -7 L 22 -5 L 11 5 L 14 20 L 0 12 L -14 20 L -11 5 L -22 -5 L -7 -7 Z"/>
    </g>
  </g>

  <!-- ── Monstera leaf bottom-right ─────────────────────────── -->
  <g transform="translate(440,820)" opacity="0.92">
    <path d="M -40 0 Q -40 -50, 0 -60 Q 40 -50, 40 0 Q 40 30, 0 30 Q -40 30, -40 0 Z" fill="url(#palmLeaf)"/>
    <!-- monstera slits -->
    <path d="M -30 -20 L -10 -20" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M -30 0 L -8 0" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M 30 -20 L 10 -20" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M 30 0 L 8 0" stroke="#fff" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- ── Teal wood plank footer ────────────────────────────── -->
  <g transform="translate(0,830)">
    <rect x="14" y="0" width="512" height="80" fill="url(#wood)" rx="6"/>
    <!-- plank lines -->
    <line x1="14" y1="40" x2="526" y2="40" stroke="#2a4858" stroke-width="0.6" opacity="0.6"/>
    <!-- nail dots -->
    <circle cx="30"  cy="14" r="2" fill="#1a3848"/>
    <circle cx="510" cy="14" r="2" fill="#1a3848"/>
    <circle cx="30"  cy="66" r="2" fill="#1a3848"/>
    <circle cx="510" cy="66" r="2" fill="#1a3848"/>
  </g>
</svg>
