<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/>
      <stop offset="0.5" stop-color="#f6e8d4"/>
      <stop offset="1" stop-color="#efddc4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa367"/>
      <stop offset="1" stop-color="#8c6a3a"/>
    </linearGradient>
    <radialGradient id="petalLight" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fce0d4"/>
      <stop offset="1" stop-color="#e8a890"/>
    </radialGradient>
    <radialGradient id="petalMid" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#f4c9b2"/>
      <stop offset="1" stop-color="#d99478"/>
    </radialGradient>
    <radialGradient id="petalDark" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#e8a890"/>
      <stop offset="1" stop-color="#b87060"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8b896"/>
      <stop offset="1" stop-color="#8a7a5a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d4c0"/>
      <stop offset="0.5" stop-color="#e8b8a0"/>
      <stop offset="1" stop-color="#d49888"/>
    </linearGradient>

    <!-- Reusable peony flower group -->
    <g id="peony">
      <!-- outer light petals -->
      <ellipse cx="0" cy="-40" rx="35" ry="48" fill="url(#petalLight)" opacity="0.85"/>
      <ellipse cx="-40" cy="-15" rx="42" ry="38" fill="url(#petalLight)" opacity="0.9"/>
      <ellipse cx="40" cy="-15" rx="42" ry="38" fill="url(#petalLight)" opacity="0.9"/>
      <ellipse cx="-25" cy="30" rx="38" ry="35" fill="url(#petalLight)" opacity="0.85"/>
      <ellipse cx="25" cy="30" rx="38" ry="35" fill="url(#petalLight)" opacity="0.85"/>
      <!-- mid petals -->
      <ellipse cx="0" cy="-20" rx="28" ry="32" fill="url(#petalMid)" opacity="0.9"/>
      <ellipse cx="-20" cy="0" rx="26" ry="28" fill="url(#petalMid)" opacity="0.9"/>
      <ellipse cx="20" cy="0" rx="26" ry="28" fill="url(#petalMid)" opacity="0.9"/>
      <ellipse cx="0" cy="20" rx="28" ry="26" fill="url(#petalMid)" opacity="0.85"/>
      <!-- inner dark petals (centre) -->
      <ellipse cx="0" cy="0" rx="18" ry="20" fill="url(#petalDark)"/>
      <ellipse cx="-6" cy="-6" rx="10" ry="12" fill="url(#petalDark)" opacity="0.85"/>
      <ellipse cx="6" cy="6" rx="10" ry="12" fill="url(#petalDark)" opacity="0.85"/>
    </g>

    <!-- Reusable leaf branch -->
    <g id="branch">
      <path d="M 0 0 Q 30 -10, 80 -40" stroke="url(#leaf)" stroke-width="1.5" fill="none"/>
      <ellipse cx="20" cy="-12" rx="14" ry="6" fill="url(#leaf)" opacity="0.7" transform="rotate(-20 20 -12)"/>
      <ellipse cx="45" cy="-25" rx="16" ry="7" fill="url(#leaf)" opacity="0.7" transform="rotate(-30 45 -25)"/>
      <ellipse cx="70" cy="-40" rx="14" ry="6" fill="url(#leaf)" opacity="0.7" transform="rotate(-40 70 -40)"/>
    </g>
  </defs>

  <rect width="540" height="960" fill="url(#bg)"/>

  <!-- ── Thin gold ornamental frame ────────────────────────────────── -->
  <rect x="20" y="20" width="500" height="920" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.55"/>
  <rect x="26" y="26" width="488" height="908" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
  <!-- corner ornaments -->
  <g fill="url(#gold)" opacity="0.55">
    <circle cx="20" cy="20" r="3"/>
    <circle cx="520" cy="20" r="3"/>
    <circle cx="20" cy="940" r="3"/>
    <circle cx="520" cy="940" r="3"/>
  </g>

  <!-- ── Top-left peony cluster ────────────────────────────────────── -->
  <use href="#peony" transform="translate(70,90) scale(1.3)"/>
  <use href="#peony" transform="translate(40,170) scale(1.0)" opacity="0.92"/>
  <use href="#branch" transform="translate(110,40) scale(0.9)"/>
  <use href="#branch" transform="translate(150,80) scale(0.7) rotate(20)"/>

  <!-- ── Top-right pink silk ribbon ────────────────────────────────── -->
  <path d="M 540 0 L 540 200 C 470 220, 400 180, 360 130 C 340 100, 360 60, 400 40 C 450 20, 510 30, 540 0 Z" fill="url(#ribbon)"/>
  <path d="M 540 30 C 490 50, 440 80, 410 110" stroke="#c08070" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 540 70 C 490 90, 450 110, 420 140" stroke="#c08070" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- ribbon tail -->
  <path d="M 380 130 C 360 160, 330 180, 300 180 C 320 175, 350 160, 370 140" fill="url(#ribbon)" opacity="0.85"/>

  <!-- ── Bottom-left peony cluster ─────────────────────────────────── -->
  <use href="#peony" transform="translate(80,840) scale(1.4)"/>
  <use href="#peony" transform="translate(40,920) scale(1.1)" opacity="0.92"/>
  <use href="#branch" transform="translate(100,900) scale(0.9) rotate(-30)"/>
  <use href="#branch" transform="translate(140,820) scale(0.7) rotate(60)"/>

  <!-- ── Bottom-right peony cluster ────────────────────────────────── -->
  <use href="#peony" transform="translate(460,860) scale(1.3) rotate(15)"/>
  <use href="#peony" transform="translate(500,930) scale(1.0)" opacity="0.92"/>
  <use href="#branch" transform="translate(430,830) scale(0.8) rotate(180)"/>
  <use href="#branch" transform="translate(380,900) scale(0.7) rotate(150)"/>

  <!-- ── Bottom-center decorative ribbon bow ───────────────────────── -->
  <g transform="translate(270,790)">
    <!-- left loop -->
    <path d="M 0 0 C -50 -25, -100 -10, -80 25 C -50 35, -20 20, 0 0 Z" fill="url(#ribbon)" opacity="0.9"/>
    <!-- right loop -->
    <path d="M 0 0 C 50 -25, 100 -10, 80 25 C 50 35, 20 20, 0 0 Z" fill="url(#ribbon)" opacity="0.9"/>
    <!-- knot -->
    <ellipse cx="0" cy="5" rx="14" ry="10" fill="url(#ribbon)"/>
    <ellipse cx="0" cy="5" rx="14" ry="10" fill="none" stroke="#c08070" stroke-width="0.6" opacity="0.5"/>
    <!-- tails -->
    <path d="M -10 12 C -30 40, -50 60, -80 70 L -60 88 C -40 70, -20 50, -4 25 Z" fill="url(#ribbon)" opacity="0.85"/>
    <path d="M 10 12 C 30 40, 50 60, 80 70 L 60 88 C 40 70, 20 50, 4 25 Z" fill="url(#ribbon)" opacity="0.85"/>
  </g>

  <!-- subtle gold sparkles -->
  <g fill="url(#gold)" opacity="0.65">
    <path d="M 280 380 L 282 384 L 286 386 L 282 388 L 280 392 L 278 388 L 274 386 L 278 384 Z"/>
    <path d="M 260 460 L 262 464 L 266 466 L 262 468 L 260 472 L 258 468 L 254 466 L 258 464 Z"/>
    <path d="M 320 380 L 322 384 L 326 386 L 322 388 L 320 392 L 318 388 L 314 386 L 318 384 Z"/>
    <circle cx="200" cy="320" r="1.2"/>
    <circle cx="380" cy="340" r="1.2"/>
    <circle cx="180" cy="540" r="1.2"/>
    <circle cx="400" cy="560" r="1.2"/>
  </g>
</svg>
