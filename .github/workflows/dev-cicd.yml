# Dev-only CI/CD for gao-social (Cloudflare Worker via OpenNext).
# - CI runs on PRs targeting `develop` and on pushes to `develop`.
# - Deploy runs only on direct pushes to `develop`, after CI passes.
# - Production (worker `gao-social`, route `app.gao.social`) is never
#   touched by this workflow — only `--env dev` is used.

name: dev-cicd (gao-social)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Bind to the `development` GitHub Environment so `vars.*` resolves
    # the NEXT_PUBLIC_* values that must be inlined into the Next.js
    # client bundle at build time. Bundle-time inlining means these
    # MUST be in process.env during `next build` — runtime worker vars
    # in wrangler.toml [env.dev.vars] do NOT affect the client bundle.
    environment:
      name: development
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Next build
        env:
          NODE_ENV: production
          CI: 'true'
          # Gao ID + WalletConnect public vars — sourced from the
          # `development` GitHub Environment Variables (not secrets;
          # these are public origin/audience identifiers that ship in
          # the JS bundle).
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GAO_ID_API: ${{ vars.NEXT_PUBLIC_GAO_ID_API }}
          NEXT_PUBLIC_GAO_ID_AUDIENCE: ${{ vars.NEXT_PUBLIC_GAO_ID_AUDIENCE }}
          NEXT_PUBLIC_GAO_ID_SIWE_DOMAIN: ${{ vars.NEXT_PUBLIC_GAO_ID_SIWE_DOMAIN }}
          NEXT_PUBLIC_GAO_ID_ENABLED: ${{ vars.NEXT_PUBLIC_GAO_ID_ENABLED }}
          # Optional. Set to `true` in env=development to surface a
          # non-secret diagnostic toast on each Gao ID SIWE click —
          # connector id/type, chainId, truncated address, deep-link
          # availability. Off by default.
          NEXT_PUBLIC_GAO_ID_DEBUG: ${{ vars.NEXT_PUBLIC_GAO_ID_DEBUG }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
        # Next.js 16 + Turbopack only static-replaces
        # `process.env.NEXT_PUBLIC_*` references from `.env*` files at
        # build time. Setting the values purely as shell environment
        # variables (the `env:` block above) leaves them as runtime
        # process-polyfill lookups, which resolve to `undefined` in the
        # browser bundle — observed 2026-05-08 by auditing the compiled
        # `isGaoIdEnabled()` body. We therefore write `.env.production`
        # (gitignored via `.env*`) immediately before `next build` so
        # the static replacement actually inlines the values. The
        # committed `.env.production.local` keeps higher precedence and
        # continues to supply NEXT_PUBLIC_GOOGLE_CLIENT_ID and
        # NEXT_PUBLIC_MAPTILER_KEY unchanged.
        run: |
          {
            printf 'NEXT_PUBLIC_APP_URL=%s\n'                  "$NEXT_PUBLIC_APP_URL"
            printf 'NEXT_PUBLIC_GAO_ID_API=%s\n'               "$NEXT_PUBLIC_GAO_ID_API"
            printf 'NEXT_PUBLIC_GAO_ID_AUDIENCE=%s\n'          "$NEXT_PUBLIC_GAO_ID_AUDIENCE"
            printf 'NEXT_PUBLIC_GAO_ID_SIWE_DOMAIN=%s\n'       "$NEXT_PUBLIC_GAO_ID_SIWE_DOMAIN"
            printf 'NEXT_PUBLIC_GAO_ID_ENABLED=%s\n'           "$NEXT_PUBLIC_GAO_ID_ENABLED"
            printf 'NEXT_PUBLIC_GAO_ID_DEBUG=%s\n'             "$NEXT_PUBLIC_GAO_ID_DEBUG"
            printf 'NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=%s\n' "$NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID"
          } > .env.production
          npm run build

      - name: OpenNext adapter build
        env:
          NODE_ENV: production
          CI: 'true'
        run: npm run cf:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-next-dev
          path: .open-next
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  deploy:
    name: Deploy (Cloudflare Worker, env=dev)
    needs: ci
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Gao-systems/Social-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download CI build artifact
        uses: actions/download-artifact@v4
        with:
          name: open-next-dev
          path: .open-next

      - name: Preflight — require deploy secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID not set in environment 'development'. Skipping deploy. Set them in GitHub → Settings → Environments → development to enable auto-deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Setup Node + install for the migration step. The CI job uses
      # actions/setup-node, but the deploy job is a separate runner so we
      # have to repeat the setup here. `npm ci` is needed so
      # `scripts/migrate.mjs` can shell out to `npx wrangler`.
      - name: Setup Node (for migrations + deploy)
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install runtime deps (deterministic)
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci

      # Probe whether the deploy token has D1 access. The deploy token
      # (CLOUDFLARE_API_TOKEN) needs `Workers Scripts: Edit` to publish,
      # but the migration runner additionally needs `D1: Edit`. A token
      # missing the D1 scope returns 7403 "account not authorized" from
      # the D1 query API. We probe with a no-op SELECT so a scope-limited
      # token does not abort the whole deploy — instead we surface a
      # high-visibility warning and let deploy continue against the
      # existing schema. Operators see the warning in the run summary
      # and can rotate the token to include D1: Edit.
      - name: Probe D1 access for migration runner
        if: steps.preflight.outputs.ready == 'true'
        id: d1probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=$(npx --yes wrangler@4 d1 execute gao-social-dev \
                  --remote --env=dev \
                  --command "SELECT 1 AS ok" 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "d1_ok=true" >> "$GITHUB_OUTPUT"
            echo "✓ D1 token scope OK"
          else
            echo "d1_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN lacks D1 scope — migrations will be skipped on this deploy. The token must be regenerated with 'Account → D1: Edit' permission for auto-migrations to run on push to develop. Until then, run \`npm run db:migrate:dev\` manually with a properly-scoped token. Original wrangler error follows."
            echo "$out"
          fi

      # Apply pending D1 migrations to the dev database BEFORE publishing
      # the worker. Idempotent — re-runs are no-ops once `_migrations` is
      # caught up. Fail-fast within the runner: if migrations error for a
      # real reason (syntax / lock / data conflict), deploy is aborted.
      - name: Apply D1 migrations (env=dev)
        if: steps.preflight.outputs.ready == 'true' && steps.d1probe.outputs.d1_ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:dev

      - name: Deploy to Cloudflare (env=dev)
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env dev
