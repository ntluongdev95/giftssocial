# Dev-only CI/CD for gao-social (Cloudflare Worker via OpenNext).
# - CI runs on PRs targeting `develop` and on pushes to `develop`.
# - Deploy runs only on direct pushes to `develop`, after CI passes.
# - Production (worker `gao-social`, route `app.gao.social`) is never
#   touched by this workflow — only `--env dev` is used.

name: dev-cicd (gao-social)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Next build
        env:
          NODE_ENV: production
          CI: 'true'
        run: npm run build

      - name: OpenNext adapter build
        env:
          NODE_ENV: production
          CI: 'true'
        run: npm run cf:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-next-dev
          path: .open-next
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  deploy:
    name: Deploy (Cloudflare Worker, env=dev)
    needs: ci
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Gao-systems/Social-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download CI build artifact
        uses: actions/download-artifact@v4
        with:
          name: open-next-dev
          path: .open-next

      - name: Preflight — require deploy secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID not set in environment 'development'. Skipping deploy. Set them in GitHub → Settings → Environments → development to enable auto-deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare (env=dev)
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env dev
